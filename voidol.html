function mk(i){const s=i.st,c=CH[i.cid];return{n:c.n,s,max:500+s[4]*5,hp:500+s[4]*5,def:s[4]*.25,sk:i.sk,ult:c.ult,us:c.us,g:0,cd:{},ef:{mute:0,charm:0,weak:0,tough:0,trend:0}}}
const sv=(f,i)=>f.s[i]*(f.ef.mute&&(i==0||i==3)?.7:1);
let LH=null;function hit(a,d,st,m,lb,xtra){const eva=Math.min(.25,d.s[1]*.0002+d.s[5]*.0001),p=Math.min(.97,.8+a.s[5]*.0002-eva)*(a.ef.charm?.65:1);
if(Math.random()>p){LH={m:1,p:Math.round(p*100)};return lb+'…かわされた！'}
const cpb=Math.min(.5,.04+a.s[1]*.0004),cr=Math.random()<cpb?1.6:1;
let raw=(30+sv(a,st)*.8)*m*R(.9,1.1)*(a.ef.trend?1.25:1)*(a.ef.weak?.75:1)*cr;
let dmg=Math.max(8,raw-d.def*.5)*(d.ef.tough?.65:1)+(xtra||0);dmg=Math.round(dmg);
d.hp=Math.max(0,d.hp-dmg);d.g=Math.min(100,d.g+Math.min(25,dmg/d.max*150));LH={d:dmg,c:cr>1,p:Math.round(p*100),cp:Math.round(cpb*100)};
return`${lb} ${dmg}ダメージ${cr>1?'💥クリティカル！':''}`}
function skill(a,d,n){switch(n){
case'神ボイス':return hit(a,d,0,1.9,'🎤神ボイス！');
case'圧倒的歌唱力':return hit(a,d,3,2.2,'🎶圧倒的歌唱力！');
case'バズ投稿':return hit(a,d,2,1.5,'📱バズ投稿！',a.s[2]*.12);
case'鉄人':a.ef.tough=3;return'🛡鉄人！被ダメージ軽減(3T)';
case'ファンの声援':{const h=Math.round(a.max*.1+a.s[2]*.3);a.hp=Math.min(a.max,a.hp+h);return`📣ファンの声援！HP+${h}`}
case'メンタル管理':{a.ef.mute=a.ef.charm=a.ef.weak=0;const h=Math.round(a.max*.05);a.hp=Math.min(a.max,a.hp+h);return`🧘メンタル管理！デバフ解除 HP+${h}`}
case'炎上商法':d.ef.weak=3;return'🔥炎上商法！相手のSNS力が低下(攻撃-25%/3T)';
case'あざとさ':d.ef.charm=2;return'💖あざとさ！相手は魅了され命中低下(2T)';
case'@0':{const h=Math.round(a.max*.08);a.hp=Math.min(a.max,a.hp+h);a.ef.trend=3;return`🍡${sn(n)}！HP+${h}・攻撃力アップ(3T)`}
case'@1':{d.g=Math.max(0,d.g-50);a.g=Math.min(100,a.g+30);return`🌙${sn(n)}！相手のゲージ-50・自分のゲージ+30`}
case'@2':{const t=hit(a,d,2,1.2,'📣'+sn(n)+'！',a.s[2]*.2),h=Math.round(a.max*.05);a.hp=Math.min(a.max,a.hp+h);return t+` HP+${h}`}
case'@3':{const t=hit(a,d,3,2,'❄️'+sn(n)+'！');d.ef.weak=2;return t+'（相手が凍えて弱体化）'}
case'@4':{d.ef.charm=3;const h=Math.round(a.max*.06);a.hp=Math.min(a.max,a.hp+h);return`☀️${sn(n)}！相手が魅了(3T) HP+${h}`}
case'@5':{a.ef.tough=2;return hit(a,d,1,1.4,'🦢'+sn(n)+'！')+'（被ダメ軽減2T）'}
case'@6':{d.ef.charm=2;d.ef.weak=2;return`🔔${sn(n)}！相手が幻惑され命中・攻撃ダウン(2T)`}
case'@7':{a.ef.mute=a.ef.charm=a.ef.weak=0;a.ef.trend=2;a.g=Math.min(100,a.g+40);return`🍊${sn(n)}！デバフ解除・攻撃アップ・ゲージ+40`}
case'天然':{const x=Math.random()*4|0;if(x==0){const h=Math.round(a.max*.12);a.hp=Math.min(a.max,a.hp+h);return`🌼天然！なぜかHP+${h}`}if(x==1)return hit(a,d,0,2.4,'🌼天然ボイス炸裂！');if(x==2){a.ef.mute=2;return'🌼天然！自分で喉を痛めた…(声・歌低下)'}d.ef.charm=2;return'🌼天然！相手がほっこり(命中低下)'}}}
function act2(a,d){let t;a.fk=null;

const EFD={mute:['😷','喉不調','声・歌が30%低下'],charm:['💖','魅了','命中率が35%低下'],weak:['🔥','弱体','与ダメージ25%低下'],tough:['🛡','鉄人','被ダメージ35%軽減'],trend:['📈','追い風','与ダメージ25%上昇']};
const RULES=`<details class="card rules"><summary>📖 バトルのルールと効果の解説（タップで開く）</summary><ul>
<li><b>流れ</b>：1対1・最大10ターン。毎ターン賢さが高い方が先に行動します（多少ブレます）。HPが0になれば勝ち。10ターン終了時は残りHPの割合が多い方の勝ちです。</li>
<li><b>行動</b>：必殺ゲージが100%なら、賢さに応じた確率（40%＋賢さ÷15 %）で必殺技。相手のHPが450未満なら確定で使います。それ以外は70%でスキル（使うと3ターン再使用不可）、30%で通常攻撃です。</li>
<li><b>ダメージ</b>＝(30＋ステータス×0.8)×技の威力(±10%) − 相手の防御×0.5。防御＝体×0.25。通常攻撃は声、スキルは技ごとに歌・SNS・顔などを使います。クリティカルで×1.6。</li>
<li><b>命中率</b>＝80%＋賢さ×0.02% − 相手の回避率（上限97%）。<b>回避率</b>＝顔×0.02%＋賢さ×0.01%（上限25%）。<b>クリティカル率</b>＝4%＋顔×0.04%（上限50%）。</li>
<li><b>必殺ゲージ</b>：自分が行動するたび+12、ダメージを受けると最大+25。</li>
<li><b>ランダムイベント</b>：2ターン目以降、各ターン終了時に30%で発生。📈トレンド入り／😷喉の不調／😍神対応／📺放送事故／🎉ファン急増／🔥炎上のどれか（各1/6）。</li>
<li><b>状態効果</b>（キャラの下に表示）：${Object.values(EFD).map(e=>`${e[0]}${e[1]}＝${e[2]}`).join('、')}。</li>
<li><b>ログの見方</b>：左の線がピンクなら左のキャラ、青なら右のキャラの行動。[命中◯%]はその攻撃の命中率、クリはクリティカル率です。</li></ul></details>`;
function pr(a,d){const ev=x=>Math.min(.25,x[1]*.0002+x[5]*.0001);return{hp:500+a[4]*5,atk:Math.round(30+a[0]*.8),def:Math.round(a[4]*.25),hit:Math.round(Math.min(.97,.8+a[5]*.0002-ev(d))*100),eva:Math.round(ev(a)*100),crit:Math.round(Math.min(.5,.04+a[1]*.0004)*100),ult:Math.round(Math.min(1,.4+a[5]/1500)*100)}}
function cmpHTML(){const L=cx.L,Q=cx.Rr,mx=Math.max(1000,...L.st,...Q.st),p=pr(L.st,Q.st),q=pr(Q.st,L.st),pc=(n,x,y,u)=>`<div class="cm"><div></div><b>${x}${u||'%'}</b><span>${n}</span><b>${y}${u||'%'}</b><div></div></div>`;
return`<div class="card cmp"><div class="row sp" style="font-size:11px;font-weight:800"><span>${CH[L.cid].n}</span><span>${CH[Q.cid].n}</span></div>${ST.map((n,k)=>{const x=L.st[k],y=Q.st[k];return`<div class="cm"><div class="bl"><i style="width:${x/mx*100}%"></i></div><b class="${x>=y?'w':''}">${x}</b><span>${n}</span><b class="${y>=x?'w':''}">${y}</b><div class="br"><i style="width:${y/mx*100}%"></i></div></div>`}).join('')}${pc('命中率',p.hit,q.hit)}${pc('回避率',p.eva,q.eva)}${pc('クリ率',p.crit,q.crit)}<details><summary>🎯 詳細データ（HP・攻撃力・防御・必殺率）</summary>${pc('最大HP',p.hp,q.hp,'')}${pc('攻撃力',p.atk,q.atk,'')}${pc('防御',p.def,q.def,'')}${pc('必殺率',p.ult,q.ult)}<div style="font-size:10px;opacity:.7">必殺率＝ゲージ満タン時に毎ターン使う確率</div></details></div>`}
function winrate(ind,lv,n){let w=0;for(let i=0;i<n;i++)if(battle(ind,cpu(ind,lv)).win)w++;return Math.round(w/n*100)}
