<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<title>ドリフトレース</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1b1f24;--mute:#6b7380;--line:#d6dbe2;--ac:#ff5a36}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2128;--fg:#e8ecf1;--mute:#9aa4b2;--line:#394150}}
:root[data-theme="dark"]{--bg:#1c2128;--fg:#e8ecf1;--mute:#9aa4b2;--line:#394150}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;overflow:hidden;background:#3a8f4b;color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}
.pn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;overflow:auto}
.pn.on{display:flex}
.box{pointer-events:auto;background:var(--bg);border-radius:18px;padding:18px;width:min(92vw,360px);box-shadow:0 8px 30px #0006;max-height:96%;overflow:auto}
h1{margin:0 0 10px;font-size:22px}
label.l{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:transparent;color:var(--fg)}
.row{display:flex;gap:10px;align-items:center}
input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:transparent}
button{font:inherit;cursor:pointer}
.pr{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;width:100%;margin-top:14px}
.sc{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.sm{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.6}
.pl{list-style:none;margin:8px 0;padding:0}
.pl li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:4px;flex:none}
#hud{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:space-between;padding:0 14px;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 6px #0008}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:24vmin;text-shadow:0 4px 18px #0009}
#hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:14px;text-shadow:0 2px 6px #0008}
#msg{position:absolute;left:0;right:0;top:44px;text-align:center;color:#fff;font-size:14px;text-shadow:0 2px 6px #0008}
#draw{flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--bg);pointer-events:auto}
#dh{padding:10px 14px;font-size:13px;color:var(--mute)}
#dm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 14px 8px}
#dz{display:flex;gap:8px;padding:0 14px 8px}
#dc{flex:1;min-height:0;width:100%;touch-action:none}
#db{display:flex;gap:10px;padding:10px 14px}#db .pr{margin:0;flex:1}
.on2{background:var(--ac);color:#fff;border-color:var(--ac)}
.box.wide{box-sizing:border-box;width:min(96vw,1000px);padding:14px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px}
.hd h1{margin:0;font-size:21px}.hd .pr{width:auto;margin:0;padding:10px 34px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0 24px}
.cols label.l{margin:9px 0 4px}
.cols .sc{padding:6px 9px;font-size:13px}
.cols input[type=text]{padding:7px 10px;font-size:15px}
.rt{display:block;font-size:10.5px;opacity:.7;line-height:1.1}.rt:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cols .sm{margin-top:4px}
.ft{text-align:center;margin-top:8px}
.cu{margin-top:6px}.cu summary{cursor:pointer;font-size:13px;color:var(--mute);padding:4px 0}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:4px}
.cg label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.cg select{padding:5px 6px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.cg input[type=color]{width:100%;height:30px;padding:0;border:0;background:none}
.cg input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:15px;width:100%;box-sizing:border-box}
@media (max-width:760px){.cols{grid-template-columns:1fr}.box.wide{width:min(94vw,420px)}}
#sp{position:absolute;right:16px;bottom:18px;color:#fff;font-weight:800;text-align:right;text-shadow:0 2px 6px #0008}
#sp b{font-size:34px}#spt{width:120px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:4px;margin-left:auto}
#spb{height:100%;border-radius:3px;background:#fff;width:0}
#sp canvas{display:block;width:140px;height:140px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
 <div id="hud"><span id="lap"></span><span id="pos"></span><span id="tm"></span></div>
 <div id="sp" style="display:none"><canvas id="spc" width="280" height="280"></canvas></div>
 <div id="big"></div><div id="msg"></div><div id="hint"></div>

 <div class="pn on" id="menu"><div class="box wide">
   <div class="hd"><h1>🏎️ ドリフトレース</h1><button class="pr" id="go">スタート</button></div>
   <div class="cols">
    <div>
     <label class="l">名前</label><input type="text" id="nm" maxlength="12">
     <label class="l">車の色</label>
     <div class="row" style="gap:8px"><input type="color" id="cl" style="width:40px;height:34px"><canvas id="pv" width="64" height="64" style="width:34px;height:34px"></canvas>
      <label class="sc" for="fi" title="車の前が上向きの縦長PNGがおすすめです">🖼️ 画像</label><input type="file" id="fi" accept="image/*" hidden>
      <button class="sc" id="rs">もどす</button></div>
     <details class="cu"><summary>🔧 カスタム（ウィングなど）</summary>
      <div class="cg">
       <label>リアウィング<select id="cuw"><option value="0">なし</option><option value="1">小さい</option><option value="2">GT</option><option value="3">高い</option></select></label>
       <label>前フェンダー<select id="cuf"><option value="0">なし</option><option value="1">ふくらみ</option><option value="2">ワイド</option><option value="3">オーバー</option><option value="4">パーツ色</option></select></label>
       <label>後ろフェンダー<select id="cur"><option value="0">なし</option><option value="1">ふくらみ</option><option value="2">ワイド</option><option value="3">オーバー</option><option value="4">パーツ色</option></select></label>
       <label>ストライプ<select id="cus"><option value="0">なし</option><option value="1">中央</option><option value="2">ふち</option></select></label>
       <label>ボンネット<select id="cud"><option value="0">ふつう</option><option value="1">ダクト</option></select></label>
       <label>パーツの色<input type="color" id="cup"></label>
       <label>背番号（絵文字OK）<input type="text" id="cun" maxlength="6" placeholder="例 7 / 🔥"></label>
      </div></details>
     <label class="l">性能</label>
     <div class="chips"><button class="sc" id="ct0">⚖️ 標準</button><button class="sc" id="ct1">🚀 加速</button><button class="sc" id="ct2">🏁 最高速</button><button class="sc" id="ct3">🌀 曲がる</button><button class="sc" id="ct4">🔥 ドリフト加速</button><button class="sc" id="ct5">🧲 グリップ</button><button class="sc" id="ct6">💥 ハイパワー</button></div>
     <div class="sm" id="ctd"></div>
    </div>
    <div>
     <label class="l">コース</label>
     <div class="chips"><button class="sc" id="df1">🏁 標準<small class="rt" id="rt_std"></small></button><button class="sc" id="pc1">⛰️ 榛名山風<small class="rt" id="rt_haruna"></small></button><button class="sc" id="pc2">🏎️ 鈴鹿風<small class="rt" id="rt_suzuka"></small></button><button class="sc" id="pc5">🔧 筑波風<small class="rt" id="rt_tsukuba"></small></button><button class="sc" id="pc6">🏙️ モナコ風<small class="rt" id="rt_monaco"></small></button></div>
     <div class="chips" style="margin-top:6px"><button class="sc" id="dw1">✏️ 自分で描く</button><button class="sc" id="rd1">🎲 周回</button><button class="sc" id="rd2">🎲 スタート→ゴール</button></div>
     <div class="sm" id="cs"></div>
     <label class="l">雰囲気</label>
     <div class="chips"><button class="sc" id="sty0">🏁 ふつう</button><button class="sc" id="sty1">⛰️ 峠</button></div>
     <label class="l">ゴースト（ベスト記録の自分が走ります）</label>
     <div class="chips"><button class="sc" id="gh1">👻 あり</button><button class="sc" id="gh0">なし</button></div>
     <label class="l">ルーム名（同じ名前の友だちと同じレースへ）</label>
     <input type="text" id="rm" maxlength="20" placeholder="空欄ならひとり">
    </div>
    <div>
     <label class="l">エンジン音</label>
     <div class="chips"><label class="sc" for="fe">選ぶ</label><input type="file" id="fe" accept="audio/*" hidden><button class="sc" id="ce">なし</button><button class="sc" id="ep0">🔊 サンプル</button></div>
     <div class="sm" id="s_engine">（音なし）</div>
     <label class="l">ドリフト音</label>
     <div class="chips"><label class="sc" for="fd">選ぶ</label><input type="file" id="fd" accept="audio/*" hidden><button class="sc" id="cd">なし</button><button class="sc" id="dp0">🔊 サンプル</button></div>
     <div class="sm" id="s_drift">（音なし）</div>
     <label class="l">音量</label><input type="range" id="vol" min="0" max="100" style="width:100%">
     <label class="l">カメラの近さ</label><input type="range" id="cz" min="60" max="400" style="width:100%">
     <label class="l">カメラの追従（左：ゆるい ／ 右：ぴったり）</label><input type="range" id="cf" min="0" max="100" style="width:100%">
    </div>
   </div>
   <div class="sm ft">左右をタッチ（← →キー）で曲がる／同時に押すとブレーキ／↑↓キーでカメラの近さ</div>
  </div></div>

 <div class="pn" id="lobby"><div class="box">
  <h1>ルーム：<span id="rn"></span></h1>
  <div class="sm" style="margin-top:0">同じルーム名を入れた人が集まります。そろったら開始！</div>
  <ul class="pl" id="lp"></ul>
  <div class="row" style="flex-wrap:wrap"><button class="sc" id="df2">🏁 標準</button><button class="sc" id="pc3">⛰️ 榛名山風</button><button class="sc" id="pc4">🏎️ 鈴鹿風</button><button class="sc" id="pc7">🔧 筑波風</button><button class="sc" id="pc8">🏙️ モナコ風</button><button class="sc" id="dw2">✏️ 描く</button></div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="sc" id="rd3">🎲 ランダム（周回）</button><button class="sc" id="rd4">🎲 ランダム（スタート→ゴール）</button></div>
  <div class="sm" id="cs2" style="margin-top:6px"></div>
  <button class="pr" id="st">レース開始</button>
  <button class="sc" id="bk" style="margin-top:10px;width:100%">もどる</button>
 </div></div>

 <div class="pn" id="draw"><div id="dh"></div><div id="dm"><button class="sc" id="dm1">🔁 周回</button><button class="sc" id="dm2">➡️ スタート→ゴール</button><span style="font-size:12px;color:var(--mute)">大きさ</span><input type="range" id="dsz" min="100" max="300" style="flex:1;min-width:90px"></div>
  <div id="dz"><button class="sc" id="zi">＋ 拡大</button><button class="sc" id="zo">− 縮小</button><button class="sc" id="zr">元の大きさ</button></div><canvas id="dc"></canvas>
  <div id="db"><button class="sc" id="dx">やめる</button><button class="sc" id="dr">描き直す</button><button class="pr" id="dk">これで決定</button></div></div>

 <div class="pn" id="end"><div class="box">
  <h1 id="et">ゴール！</h1>
  <ul class="pl" id="ep"></ul>
  <div class="sm" id="eb"></div>
  <button class="pr" id="ag">もう一度</button>
  <button class="sc" id="mn" style="margin-top:10px;width:100%">メニューへ</button>
 </div></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();

/* ---- コース ---- */
let touge=LS('dr_touge')!=='0';
let HW=touge?68:78.2;const LAPS=3;  /* 道の半分の太さ：峠は68 / ふつうは78.2 */
/* 速度の設定：最高速度 / いちばん遅い速度 / 加速のはやさ / 減速のはやさ */
/* 車のタイプごとの性能：K=メーターの最高km/h / 加速 / 曲がりやすさ / タイヤのグリップ */
const CARS={
 std:{K:190,ACC:340,TURN:2.7,GRIP:1.4,d:'バランス型'},
 acc:{K:172,ACC:520,TURN:2.7,GRIP:1.4,d:'加速が速い／最高速は低め'},
 top:{K:208,ACC:240,TURN:2.7,GRIP:1.4,d:'最高速が高い／加速はゆっくり'},
 hand:{K:172,ACC:340,TURN:3.6,GRIP:1.9,d:'よく曲がる／最高速は低め'},
 drf:{K:164,ACC:300,TURN:2.7,GRIP:1.4,B:1.35,d:'ふだんは低め／ドリフトのあとブースト'},
 grip:{K:170,ACC:295,TURN:2.6,GRIP:4.5,d:'ほとんど滑らない／安定して曲がる'},
 pow:{K:206,ACC:560,TURN:2.7,GRIP:0.6,d:'パワーが高い／よく滑る'}};
let carType=(()=>{const v=LS('dr_car');return CARS[v]?v:'std'})();
let MAXV,ACC,TURN,GRIP,GMAX;const MINV=170,DEC=320,BRAKE=700,REVA=320,REVV=190;
function applyCar(){const c=CARS[carType];MAXV=c.K/.3;ACC=c.ACC;TURN=c.TURN;GRIP=c.GRIP;GMAX=Math.max(180,Math.ceil(c.K*(c.B||1)/20)*20)}
applyCar();
/* ダート（コース外）：この速度まで一気に落ちる / 落ちるはやさ */
const DIRTV=100,DIRTDEC=650;
const DEF_T=[[49,-2115],[751,-1158],[1994,-1146],[2114,-86],[2059,1024],[556,1136],[162,2110],[-1286,1907],[-1727,1222],[-2109,-175],[-1047,-710],[-957,-2091]];
const DEF_N=[800,1000,700,950,650,900,750,1000,680,880].map((r,i,A)=>{const a=i/A.length*Math.PI*2-Math.PI/2;r*=1.8;return[Math.round(Math.cos(a)*r),Math.round(Math.sin(a)*r)]});
let DEF=touge?DEF_T:DEF_N;
let curName='',TR=[],T=[],TH=[],path=null,N=0,curPts=null,curLine=false,CLOSED=true,SI=0,GI=0,FINT=1;
const RUN=26;
function sampleTrack(PT,line){
 const out=[],K=PT.length;
 const seg=(a,b,c,d)=>{const n=Math.max(4,Math.round(Math.hypot(c[0]-b[0],c[1]-b[1])/12));
  for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
   const f=j=>0.5*(2*b[j]+(-a[j]+c[j])*t+(2*a[j]-5*b[j]+4*c[j]-d[j])*t2+(-a[j]+3*b[j]-3*c[j]+d[j])*t3);
   out.push([f(0),f(1)])}};
 if(!line){for(let i=0;i<K;i++)seg(PT[(i+K-1)%K],PT[i],PT[(i+1)%K],PT[(i+2)%K]);return out}
 const P=[[2*PT[0][0]-PT[1][0],2*PT[0][1]-PT[1][1]],...PT,[2*PT[K-1][0]-PT[K-2][0],2*PT[K-1][1]-PT[K-2][1]]];
 for(let i=1;i<K;i++)seg(P[i-1],P[i],P[i+1],P[i+2]);
 out.push(PT[K-1].slice());return out;
}
function setTrack(PT,line){
 let tt=sampleTrack(PT,line);CLOSED=!line;SI=0;
 if(line){
  const n=tt.length,d0=Math.atan2(tt[1][1]-tt[0][1],tt[1][0]-tt[0][0]),d1=Math.atan2(tt[n-1][1]-tt[n-2][1],tt[n-1][0]-tt[n-2][0]),pre=[],post=[];
  for(let j=RUN;j>=1;j--)pre.push([tt[0][0]-Math.cos(d0)*12*j,tt[0][1]-Math.sin(d0)*12*j]);
  for(let j=1;j<=RUN;j++)post.push([tt[n-1][0]+Math.cos(d1)*12*j,tt[n-1][1]+Math.sin(d1)*12*j]);
  SI=RUN;GI=RUN+n-1;tt=pre.concat(tt,post);
 }
 T=tt;N=T.length;
 TH=T.map((p,i)=>{const j=(!CLOSED&&i===N-1)?N-2:i,a=T[j],b=T[(j+1)%N];return Math.atan2(b[1]-a[1],b[0]-a[0])});
 FINT=CLOSED?LAPS*N:GI-SI;
 path=new Path2D();T.forEach((p,i)=>i?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1]));if(CLOSED)path.closePath();
 TR=[];const lim2=(HW+64)*(HW+64);
 if(touge)for(let i=0;i<N;i+=6){const th=TH[i];for(const sd of [-1,1])for(let k=0;k<1;k++){
  const off=HW+75+Math.random()*300,x=T[i][0]-Math.sin(th)*sd*off+(Math.random()-.5)*40,y=T[i][1]+Math.cos(th)*sd*off+(Math.random()-.5)*40;
  let ok=true;for(let j=0;j<N;j+=3){const dx=x-T[j][0],dy=y-T[j][1];if(dx*dx+dy*dy<lim2){ok=false;break}}
  if(ok)TR.push([x,y,20+Math.random()*22,Math.random()<.35?1:0])}}
}
function near(x,y,from){let best=from,bd=1e18;for(let k=-12;k<=12;k++){let i=from+k;if(CLOSED)i=(i+N)%N;else if(i<0||i>=N)continue;const dx=x-T[i][0],dy=y-T[i][1],d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}return[best,Math.sqrt(bd)]}
function validPts(p){return Array.isArray(p)&&p.length>=8&&p.length<=200&&p.every(q=>Array.isArray(q)&&q.length===2&&Number.isFinite(q[0])&&Number.isFinite(q[1])&&Math.abs(q[0])<40000&&Math.abs(q[1])<40000)}
setTrack(DEF,false);
try{const sv=JSON.parse(LS('dr_course')||'null'),pp=Array.isArray(sv)?sv:sv&&sv.p,ln=!!(sv&&!Array.isArray(sv)&&sv.l);if(validPts(pp)){curPts=pp;curLine=ln;curName=LS('dr_cname')||'';setTrack(pp,ln)}}catch(e){}

/* ---- 設定・車の見た目 ---- */
let name=LS('dr_name')||'プレイヤー',col=LS('dr_col')||'#ff5a36',meImg=null,shareSkin=null;
$('nm').value=name;$('cl').value=col;
const NOCU={no:'',w:0,ff:0,rf:0,st:0,d:0,pc:'#222222'};
function cleanNo(t){return Array.from(String(t||'').replace(/[,<>]/g,'')).slice(0,2).join('')}
function normCu(o){const n=(v,m)=>Math.max(0,Math.min(m,v|0));return{no:cleanNo(o.no),w:n(o.w,3),ff:n(o.ff,4),rf:n(o.rf,4),st:(o.st|0)>2?0:n(o.st,2),d:n(o.d,1),pc:/^#[0-9a-f]{6}$/i.test(o.pc||'')?o.pc:'#222222'}}
let cust=(()=>{try{return normCu(JSON.parse(LS('dr_cust')||'{}'))}catch(e){return normCu({})}})();
function pcRgb(k){const h=cust.pc,r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r+(255-r)*k|0,g+(255-g)*k|0,b+(255-b)*k|0].join(',')}
function cuStr(){return'v3:'+[cust.w,cust.ff,cust.rf,cust.st,cust.d,cust.pc,cust.no].join(',')}
function parseCu(s){if(typeof s!=='string'||s.length>60||s.slice(0,3)!=='v3:')return null;const a=s.slice(3).split(',');return normCu({w:+a[0],ff:+a[1],rf:+a[2],st:+a[3],d:+a[4],pc:a[5],no:a[6]})}

function enterRoom(code){
 return new Promise(resolve=>{
  if(!window.Peer){resolve(null);return}
  const HID='drdrift-'+code,ons={},cbs=[],all={},conns={};
  let myId=null,isHost=false,hostConn=null,pr=null,ok=false,mine={};
  const ps=()=>{const a=[{peer:myId,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:mine}];
   for(const k in all)if(k!==myId)a.push({peer:k,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:all[k]});return a};
  const fire=m=>(ons[m.topic]||[]).forEach(f=>{try{f(m)}catch(e){}});
  const notify=(j,l)=>{const p=ps();cbs.forEach(f=>{try{f({peers:p,joined:j,left:l,updated:[]})}catch(e){}})};
  const others=ex=>Object.values(conns).filter(c=>c.open&&c.peer!==ex);
  const onMsg=(from,d)=>{
   if(!d)return;
   if(d.t==='pres'){const nw=!(d.id in all);all[d.id]=d.p;if(isHost)others(from).forEach(c=>c.send(d));if(nw)notify([{peer:d.id}],[])}
   else if(d.t==='snap'){const nj=[];for(const k in d.all){if(k!==myId&&!(k in all))nj.push({peer:k});all[k]=d.all[k]}if(nj.length)notify(nj,[])}
   else if(d.t==='ev'){if(isHost)others(from).forEach(c=>c.send(d));fire({topic:d.topic,data:d.data,peer:d.id,isMe:false,sameTab:false,kind:'viewer'})}
   else if(d.t==='left'){if(d.id in all){delete all[d.id];notify([],[{peer:d.id}])}}
  };
  const send=d=>{if(isHost)others(null).forEach(c=>c.send(d));else if(hostConn&&hostConn.open)hostConn.send(d)};
  const api={
   peers:ps,
   presence(p){Object.assign(mine,p);send({t:'pres',id:myId,p:mine});return Promise.resolve()},
   emit(topic,data){send({t:'ev',id:myId,topic,data});fire({topic,data,peer:myId,isMe:true,sameTab:true,kind:'viewer'});return Promise.resolve()},
   on(t,f){(ons[t]=ons[t]||[]).push(f);return()=>{}},
   onPeers(f){cbs.push(f);return()=>{}},
   leave(){try{pr.destroy()}catch(e){}}
  };
  const fin=()=>{if(!ok){ok=true;wireRoom(api);resolve(api)}};
  const tryClient=()=>{
   const p=new Peer();
   p.on('open',id=>{myId=id;pr=p;const c=p.connect(HID,{reliable:true});hostConn=c;
    c.on('open',()=>{fin();send({t:'pres',id:myId,p:mine})});
    c.on('data',d=>onMsg(null,d));
    c.on('close',()=>msg('ルームを作った人との接続が切れました',5000))});
   p.on('error',()=>{if(!ok)resolve(null)});
  };
  const tryHost=()=>{
   const p=new Peer(HID);
   p.on('open',id=>{myId=id;isHost=true;pr=p;fin()});
   p.on('connection',c=>{conns[c.peer]=c;
    c.on('open',()=>c.send({t:'snap',all:Object.assign({},all,{[myId]:mine})}));
    c.on('data',d=>onMsg(c.peer,d));
    c.on('close',()=>{delete conns[c.peer];const d={t:'left',id:c.peer};others(null).forEach(x=>x.send(d));onMsg(null,d)})});
   p.on('error',e=>{if(e.type==='unavailable-id'){try{p.destroy()}catch(x){}tryClient()}else if(!ok)resolve(null)});
  };
  setTimeout(()=>{if(!ok)resolve(null)},9000);
  tryHost();
 });
}

 else if(me.sp<0)me.sp=Math.min(0,me.sp+ACC*1.5*dt);

  else if(spB>MAXV){me.sp=Math.max(MAXV,spB-260*dt)}}

 const[i,d]=near(me.x,me.y,me.idx),lim=HW+45;
 if(d>lim){const c=T[i],nx=(me.x-c[0])/d,ny=(me.y-c[1])/d;me.x=c[0]+nx*lim;me.y=c[1]+ny*lim;
  const vn=me.vx*nx+me.vy*ny;if(vn>0){me.vx-=nx*vn*1.3;me.vy-=ny*vn*1.3}}

 const sp=Math.hypot(me.vx,me.vy)||1,slip=Math.abs((me.vx*Math.sin(me.h)-me.vy*Math.cos(me.h))/sp);

const gst=()=>{const v=[...dptr.values()],a=v[0],b=v[1];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2}};
dc.addEventListener('pointerdown',e=>{
 dc.setPointerCapture(e.pointerId);dptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(e.pointerType==='mouse'&&e.button!==0){dpan=[e.clientX,e.clientY];return}
 if(dptr.size>=2){dDown=false;if(!dPts){dRaw=[];dredraw()}dgest=gst();return}
 dDown=true;dPts=null;dRaw=[dpos(e)];dredraw();$('dh').textContent=DH;
});

 if(dptr.has(e.pointerId))dptr.set(e.pointerId,[e.clientX,e.clientY]);

 if(dptr.size>=2&&dgest){if(dPts)return;
  const g=gst(),r=dc.getBoundingClientRect(),nz=Math.max(.3,Math.min(6,dz*g.d/dgest.d));
  const wx=(dgest.cx-r.left-dox)/dz,wy=(dgest.cy-r.top-doy)/dz;
  dox=g.cx-r.left-wx*nz;doy=g.cy-r.top-wy*nz;dz=nz;dgest=g;dredraw();return;
 }
 if(!dDown)return;
 const p=dpos(e),l=dRaw[dRaw.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<4/dz)return;
 dRaw.push(p);dg.save();dg.setTransform(DPR*dz,0,0,DPR*dz,DPR*dox,DPR*doy);
 dg.strokeStyle='#ff5a36';dg.lineWidth=6/dz;dg.lineCap='round';dg.beginPath();dg.moveTo(l[0],l[1]);dg.lineTo(p[0],p[1]);dg.stroke();dg.restore();
});
const dEnd=()=>{if(!dDown)return;dDown=false;finishDraw()};
const dUp=e=>{dptr.delete(e.pointerId);if(dptr.size<2)dgest=null;if(dpan&&dptr.size===0)dpan=null;dEnd()};

function courseFrom(raw,line,fac){
 const L=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),n0=raw.length,m=line?n0-1:n0;
 const cum=[0];for(let i=0;i<m;i++)cum.push(cum[i]+L(raw[i],raw[(i+1)%n0]));
 const per=cum[m];if(per<60)return null;
 const tgt=5500*fac*(line?1.4:1),sc=tgt/per,K=Math.max(24,Math.min(190,Math.round(tgt/60))),out=[];let j=0;
 for(let k=0;k<K;k++){const s=line?k*per/(K-1):k*per/K;while(j<m-1&&cum[j+1]<s)j++;
  const a=raw[j],b=raw[(j+1)%n0],t=(s-cum[j])/((cum[j+1]-cum[j])||1);
  out.push([(a[0]+(b[0]-a[0])*t)*sc,(a[1]+(b[1]-a[1])*t)*sc])}
 const sm=()=>{const n=out.length,o=out.map((p,i)=>{if(line&&(i===0||i===n-1))return p;const a=out[(i+n-1)%n],c=out[(i+1)%n];return[a[0]*.25+p[0]*.5+c[0]*.25,a[1]*.25+p[1]*.5+c[1]*.25]});for(let i=0;i<n;i++)out[i]=o[i]};
 const minR=()=>{let mm=1e9;const n=out.length;for(let i=line?1:0;i<(line?n-1:n);i++){const a=out[(i+n-1)%n],b=out[i],c=out[(i+1)%n];
  const ar=Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2;if(ar>1e-6)mm=Math.min(mm,L(a,b)*L(b,c)*L(c,a)/(4*ar))}return mm};
 for(let i=0;i<2;i++)sm();
 for(let i=0;i<30&&minR()<70;i++)sm();
 const cx=out.reduce((u,p)=>u+p[0],0)/K,cy=out.reduce((u,p)=>u+p[1],0)/K;
 return out.map(p=>[Math.round(p[0]-cx),Math.round(p[1]-cy)]);
}
function finishDraw(){
 if(dRaw.length<25){dsize();$('dh').textContent='もう少し長く、大きく描いてください。';return}
 const pts=courseFrom(dRaw,dMode==='line',dFac);if(!pts||!validPts(pts)){dsize();$('dh').textContent='うまく作れませんでした。もう一度、描いてみてください。';return}
 dPts=pts;dsize();previewCourse();
}
function previewCourse(){
 const line=dMode==='line',TT=sampleTrack(dPts,line);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 TT.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
 const cw=dc.clientWidth,ch=dc.clientHeight,k=Math.min(cw,ch)*.82/Math.max(x1-x0,y1-y0);
 dg.save();dg.translate(cw/2,ch/2);dg.scale(k,k);dg.translate(-(x0+x1)/2,-(y0+y1)/2);
 dg.lineJoin='round';dg.beginPath();TT.forEach((p,i)=>i?dg.lineTo(p[0],p[1]):dg.moveTo(p[0],p[1]));if(!line)dg.closePath();
 dg.lineWidth=HW*2+(touge?24:28);dg.strokeStyle=touge?'#9ba1ab':'#d94a3d';dg.stroke();dg.lineWidth=HW*2;dg.strokeStyle='#4b5160';dg.stroke();
 const mark=(i,j,c1,c2)=>{const p=TT[i],q=TT[j],an=Math.atan2(q[1]-p[1],q[0]-p[0]);dg.save();dg.translate(p[0],p[1]);dg.rotate(an);
  dg.fillStyle=c1;dg.fillRect(-9,-HW,18,HW);dg.fillStyle=c2;dg.fillRect(-9,0,18,HW);dg.restore()};
 mark(0,1,'#fff','#fff');if(line)mark(TT.length-1,TT.length-2,'#fff','#111');
 dg.restore();
 $('dh').textContent=line?'こんなコースができました。よければ「これで決定」！（白い線がスタート、白黒の線がゴール）':'こんなコースができました。よければ「これで決定」！（白い線がスタート地点です）';
}

function randomCourse(line){
 const rnd=(a,b)=>a+Math.random()*(b-a);
 for(let tries=0;tries<6;tries++){
  const ctrl=[];
  if(!line){
   const n=Math.floor(touge?rnd(12,18):rnd(9,15)),sx=rnd(.8,1.25);let r=rnd(.6,1);
   for(let i=0;i<n;i++){const a=(i+rnd(touge?-.2:-.25,touge?.2:.25))/n*Math.PI*2;r=Math.max(touge?.4:.45,Math.min(1,r+rnd(touge?-.5:-.4,touge?.5:.4)));ctrl.push([Math.cos(a)*r*1000*sx,Math.sin(a)*r*1000])}
  }else{
   const n=Math.floor(touge?rnd(11,17):rnd(8,13));let x=0,y=0,h=rnd(0,Math.PI*2),sg=Math.random()<.5?1:-1,net=0;ctrl.push([0,0]);
   for(let i=1;i<n;i++){const d=touge?(Math.random()<.2?rnd(1.5,2.1):rnd(.4,1.1)):rnd(.3,.95);h+=sg*d;net+=sg*d;if(Math.random()<(touge?.55:.4)||Math.abs(net)>(touge?2.6:2.2))sg=net>0?-1:1;
    const l=touge?rnd(480,900):rnd(600,1000);x+=Math.cos(h)*l;y+=Math.sin(h)*l;ctrl.push([x,y])}
  }
  const pts=courseFrom(sampleTrack(ctrl,line),line,dFac);
  if(pts&&validPts(pts)){setCourse(pts,true,line);msg('ランダムなコースを作りました（気に入らなければもう一度おしてください）',3500);return}
 }
}
